[project]
name = "carelake"
version = "1.0.0"
description = "Enterprise Healthcare Medallion Lakehouse with Apache Iceberg, PySpark Ingestion, dbt Models, and Clinical Marts"
authors = [{ name = "Pruthvi Nag Gattu", email = "gattupruthvinag5@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5.0",
    "duckdb>=0.10.2",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
]

[project.scripts]
carelake = "carelake.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["carelake*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
